  <section class="block menu-sec" id="menu">
    <div class="wrap menu-grid">
      <div class="head">
        <h2 class="h2" data-in>昼も夜も、<br>おまかせで。</h2>
      </div>
      <figure class="ph ph-a" data-wipe>{{img:menu|(max-width: 900px) 100vw, 50vw}}</figure>
      <div class="prices">
        <div class="price" data-in><span class="when">昼　12:00 / 13:15</span><h3>おまかせ　十二貫</h3><span class="yen num">16,500<small>円</small></span><p>握り十二貫と、お椀。昼は一斉に始めます。</p></div>
        <div class="price" data-in style="--d:100ms"><span class="when">夜　17:30 / 20:00</span><h3>おまかせ　十五貫</h3><span class="yen num">38,500<small>円</small></span><p>季節のつまみ五品と、握り十五貫、お椀、玉子。</p></div>
        <div class="price" data-in style="--d:200ms"><span class="when">お持ち帰り</span><h3>折詰</h3><span class="yen num">8,800<small>円</small></span><p>江戸前の仕事をした握り十貫を、杉の折に。前日の正午までにご予約ください。</p></div>
      </div>
      <div class="drinks">
        <figure class="ph" data-wipe>{{img:sake|(max-width: 900px) 100vw, 30vw}}</figure>
        <div data-in>
          <h3>酒</h3>
          <p>赤酢のシャリに合う、旨みのしっかりした純米酒を中心に、常時十二種。燗は、一本ずつ銅の燗つけ器で。シャンパーニュと、ブルゴーニュの白もございます。</p>
        </div>
      </div>
      <p style="grid-column:1/-1;margin:48px 0 0;font-size:12px;color:var(--nezumi)">価格はすべて税込です。夜はサービス料10%を別に頂戴します。</p>
    </div>
  </section>
