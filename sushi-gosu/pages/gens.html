      <div class="text">
        <h2 class="h2" data-in>三代、<br>同じ場所で。</h2>
        <div class="prose" data-in>
          <p>祖父が日本橋の魚河岸のそばで暖簾を掲げてから、六十余年。店は一度建て替えましたが、白木のカウンターと、暖簾の染めの色は変えていません。</p>
        </div>
        <ol class="timeline" data-in>
          <li><span class="y num">1962<small>昭和三十七年</small></span><div><h3>初代、暖簾を掲げる</h3><p>日本橋室町に、カウンター八席の店を開く。</p></div></li>
          <li><span class="y num">1991<small>平成三年</small></span><div><h3>二代目が継ぐ</h3><p>赤酢のシャリを完成させ、いまの味の土台をつくる。</p></div></li>
          <li><span class="y num">2019<small>令和元年</small></span><div><h3>三代目、つけ場に立つ</h3><p>十五貫のおまかせ一本に。一貫ごとに仕事を伝える。</p></div></li>
        </ol>
        <p class="sig" data-in>三代目<b>藍沢 宗一</b></p>
      </div>
