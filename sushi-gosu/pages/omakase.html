  <section class="omakase" aria-label="おまかせ十五貫">
    <ol class="vh" id="omakase-list">
{{OMAKASE_LIST}}
    </ol>
    <div class="serve" id="serve" aria-hidden="true">
      <div class="stage">
        <div class="count">
          <span class="nth" id="nth">一</span><span class="of">貫目　／　十五貫</span>
          <div class="ticks" id="ticks"></div>
        </div>
        <div class="plate-wrap">
          <svg class="plate" id="plate" viewBox="-250 -250 500 500">
            <circle r="240" fill="#F7F7F3"/>
            <circle r="236" fill="none" stroke="#2F4FA0" stroke-width="3"/>
            <g id="rim" fill="none" stroke="#2F4FA0" stroke-width="1.6"></g>
            <circle r="198" fill="none" stroke="#2F4FA0" stroke-width="1.2"/>
            <circle r="190" fill="none" stroke="#2F4FA0" stroke-width=".6" opacity=".6"/>
            <circle r="120" fill="none" stroke="#2F4FA0" stroke-width=".6" stroke-dasharray="2 6" opacity=".4"/>
            <g transform="translate(0 170) scale(.6)" style="color:#2F4FA0;--crest-fill:#F7F7F3" opacity=".75"><use href="#crest" x="-20" y="-20" width="40" height="40"/></g>
          </svg>
          <div class="neta" id="neta"><span>鯛</span></div>
        </div>
        <div class="detail" id="detail">
          <p class="yomi" id="d-yomi">たい</p>
          <dl>
            <dt>産地</dt><dd id="d-origin">明石</dd>
            <dt>仕事</dt><dd><span class="waza" id="d-waza">昆布締め</span></dd>
          </dl>
          <p class="note" id="d-note">利尻昆布で一晩。身が締まり、旨みが移ります。</p>
        </div>
      </div>
      <p class="serve-hint">SCROLL</p>
    </div>
  </section>
